<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-DO LIST</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <div class="container py-5" style="max-width:700px;">
        <h1 class="text-center mb-4"> My To-Do List</h1>
        
        <div class="text-center mb-4 status-filters">
         <button class="btn filter-btn active" data-status="all">All</button>
        <button class="btn filter-btn" data-status="active">Active</button>
        <button  class="btn filter-btn" data-status="completed">Completed</button>
        
        </div>
        <form id="todo-form" class="mb-4">
            <div class="mb-2">
                <input
                type="text"
                id="task-name"
                class="form-control"
                placeholder="What do you need to do?"
                required
                >

            </div>
            <div class="row g-2 mb-2">
                <div class="col-6">
                    <select id="task-priority" class="form-select" required>
                        <option value="">Priority...</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <div class="col-6">
                    <input
                    type="date"
                    id="task-due"
                    class="form-control"
                    required
                    >
                </div>
            </div>
<button type="submit" id="add-btn" class="btn w-100">+ Add Task</button>

        </form>
        <ul id="task-list" class="list-group"></ul>
        <p id="empty-message" class="text-center text-muted mt-4">
            No tasks yet. Add one above!
        </p>

    </div>
    <script src="main.js"></script>
    
</body>
</html>
